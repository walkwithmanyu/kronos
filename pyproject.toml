[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "kronos-engine"
version = "0.1.0"
description = "Compress time. Test everything. Simulate weeks of activity in minutes."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["testing", "simulation", "time-compression", "stress-test", "crm", "saas"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = []   # zero required dependencies — pure stdlib

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
kronos = "kronos.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kronos*"]
